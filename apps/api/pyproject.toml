[project]
name = "customer-journey-api"
version = "0.1.0"
description = "Customer Journey Tracking and Automation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastAPI and ASGI
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    
    # Pydantic
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database - PostgreSQL
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    
    # Database - ClickHouse
    "clickhouse-connect>=0.7.0",
    
    # Redis
    "redis>=5.0.0",
    
    # Auth
    "python-jose[cryptography]>=3.3.0",
    
    # Utilities
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
