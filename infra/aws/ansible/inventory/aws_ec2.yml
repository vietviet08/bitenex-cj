plugin: amazon.aws.aws_ec2
profile: default
regions:
    - ap-southeast-1
filters:
    tag:Project: bitenex
    tag:Role: bitenex-api-host
hostnames:
    - ip-address
compose:
    ansible_host: public_ip_address
    ansible_user: "'ubuntu'"
    ansible_ssh_private_key_file: "'~/.ssh/sing.pem'"
keyed_groups:
    - key: tags.Role
      prefix: role
