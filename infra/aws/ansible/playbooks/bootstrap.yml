---
- name: Bootstrap Ubuntu server and deploy bitenex-api compose stack
  hosts: role_bitenex_api_host
  become: true
  vars_files:
      - ../group_vars/all.yml
  vars:
      jenkins_apt_key_url: "https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key"
      jenkins_apt_keyring_path: "/etc/apt/keyrings/jenkins-keyring.asc"
      jenkins_apt_repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
      compose_cmd: "docker compose -f {{ bitenex_compose_file }}"
      nginx_tls_domains: "{{ [nginx_api_server_name, nginx_n8n_server_name, nginx_pgadmin_server_name] | reject('equalto', '') | unique | list }}"

  tasks:
      - name: Load vaulted deployment secrets
        ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../vault.yml"

      - name: Assert required deployment inputs are set
        ansible.builtin.assert:
            that:
                - bitenex_database_host != "replace-with-rds-endpoint"
                - nginx_api_server_name != "api.example.com"
                - bitenex_n8n_public_url != "http://n8n.example.com"
                - bitenex_vnp_ipn_url != "https://api.example.com/api/v1/payments/webhook/vnpay"
                - nginx_pgadmin_server_name != "pgadmin.example.com"
                - letsencrypt_email | length > 3
                - "'@' in letsencrypt_email"
                - vault_bitenex_secret_key is defined
                - vault_bitenex_jwt_secret_key is defined
                - vault_bitenex_database_password is defined
                - vault_bitenex_internal_api_token is defined
                - vault_bitenex_n8n_webhook_secret is defined
                - vault_bitenex_n8n_basic_auth_password is defined
                - vault_pgadmin_default_password is defined
                - vault_sonarqube_postgres_password is defined
                - not vault_bitenex_secret_key.startswith("replace-with-")
                - not vault_bitenex_jwt_secret_key.startswith("replace-with-")
                - not vault_bitenex_database_password.startswith("replace-with-")
                - not vault_bitenex_internal_api_token.startswith("replace-with-")
                - not vault_bitenex_n8n_webhook_secret.startswith("replace-with-")
                - not vault_bitenex_n8n_basic_auth_password.startswith("replace-with-")
                - not vault_pgadmin_default_password.startswith("replace-with-")
                - not vault_sonarqube_postgres_password.startswith("replace-with-")
            fail_msg: "Populate group_vars/all.yml and ansible/vault.yml with real deployment values before bootstrap."

      - name: Update apt cache
        ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600

      - name: Install base dependencies
        ansible.builtin.apt:
            name:
                - ca-certificates
                - curl
                - gnupg
                - lsb-release
                - apt-transport-https
                - software-properties-common
                - git
                - net-tools
                - nginx
                - certbot
                - openjdk-17-jdk
                - python3-certbot-nginx
            state: present

      - name: Configure sysctl for container workloads
        ansible.builtin.copy:
            dest: /etc/sysctl.d/99-bitenex.conf
            owner: root
            group: root
            mode: "0644"
            content: |
                vm.max_map_count=524288
                fs.file-max=131072

      - name: Apply sysctl settings
        ansible.builtin.command: sysctl --system
        changed_when: false

      - name: Create Docker keyring directory
        ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

      - name: Download Docker apt gpg key
        ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

      - name: Add Docker apt repository
        ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
            filename: docker

      - name: Install Docker engine and compose plugin
        ansible.builtin.apt:
            name:
                - docker-ce
                - docker-ce-cli
                - containerd.io
                - docker-buildx-plugin
                - docker-compose-plugin
            state: present
            update_cache: true

      - name: Ensure Docker service is running
        ansible.builtin.service:
            name: docker
            state: started
            enabled: true

      - name: Ensure Nginx service is running
        ansible.builtin.service:
            name: nginx
            state: started
            enabled: true

      - name: Add ubuntu user to docker group
        ansible.builtin.user:
            name: ubuntu
            groups: docker
            append: true

      - name: Add Jenkins apt key
        ansible.builtin.get_url:
            url: "{{ jenkins_apt_key_url }}"
            dest: "{{ jenkins_apt_keyring_path }}"
            mode: "0644"

      - name: Add Jenkins apt repository
        ansible.builtin.apt_repository:
            repo: "{{ jenkins_apt_repo }}"
            state: present
            filename: jenkins

      - name: Install Jenkins
        ansible.builtin.apt:
            name: jenkins
            state: present
            update_cache: true

      - name: Ensure Jenkins service is running
        ansible.builtin.service:
            name: jenkins
            state: started
            enabled: true

      - name: Add Jenkins user to docker group
        ansible.builtin.user:
            name: jenkins
            groups: docker
            append: true

      - name: Create deployment base directory
        ansible.builtin.file:
            path: /opt/bitenex
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0755"

      - name: Create ACME challenge webroot
        ansible.builtin.file:
            path: /var/www/certbot
            state: directory
            owner: www-data
            group: www-data
            mode: "0755"

      - name: Checkout bitenex repository
        ansible.builtin.git:
            repo: "{{ bitenex_repo_url }}"
            dest: /opt/bitenex/repo
            version: "{{ bitenex_repo_version }}"
            force: true
        become_user: ubuntu

      - name: Render API environment file
        ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/bitenex.env.j2"
            dest: "{{ bitenex_compose_dir }}/.env"
            owner: ubuntu
            group: ubuntu
            mode: "0600"

      - name: Render Docker services environment file
        ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/bitenex.env.docker.j2"
            dest: "{{ bitenex_compose_dir }}/.env.docker"
            owner: ubuntu
            group: ubuntu
            mode: "0600"

      - name: Create pgAdmin config directory
        ansible.builtin.file:
            path: "{{ bitenex_compose_dir }}/deploy/pgadmin"
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: "0750"

      - name: Render pgAdmin server definitions
        ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/pgadmin-servers.json.j2"
            dest: "{{ bitenex_compose_dir }}/deploy/pgadmin/servers.json"
            owner: ubuntu
            group: ubuntu
            mode: "0640"

      - name: Render pgAdmin passfile
        ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/pgadmin-pgpassfile.j2"
            dest: "{{ bitenex_compose_dir }}/deploy/pgadmin/pgpassfile"
            owner: ubuntu
            group: ubuntu
            mode: "0600"

      - name: Render bootstrap Nginx reverse proxy config
        ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/nginx-bitenex.conf.j2"
            dest: /etc/nginx/sites-available/bitenex.conf
            owner: root
            group: root
            mode: "0644"
        vars:
            nginx_tls_ready: false

      - name: Enable Bitenex Nginx site
        ansible.builtin.file:
            src: /etc/nginx/sites-available/bitenex.conf
            dest: /etc/nginx/sites-enabled/bitenex.conf
            state: link

      - name: Disable default Nginx site
        ansible.builtin.file:
            path: /etc/nginx/sites-enabled/default
            state: absent

      - name: Validate Nginx config
        ansible.builtin.command: nginx -t
        changed_when: false

      - name: Reload Nginx
        ansible.builtin.service:
            name: nginx
            state: reloaded

      - name: Request Let's Encrypt certificates
        ansible.builtin.command:
            cmd: >-
                certbot certonly --webroot -w /var/www/certbot
                --non-interactive --agree-tos --email {{ letsencrypt_email }}
                -d {{ item }}
        args:
            creates: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
        loop: "{{ nginx_tls_domains }}"
        when: nginx_enable_tls

      - name: Render final Nginx reverse proxy config with TLS
        ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/nginx-bitenex.conf.j2"
            dest: /etc/nginx/sites-available/bitenex.conf
            owner: root
            group: root
            mode: "0644"
        vars:
            nginx_tls_ready: "{{ nginx_enable_tls }}"
        when: nginx_enable_tls

      - name: Validate final Nginx config
        ansible.builtin.command: nginx -t
        changed_when: false
        when: nginx_enable_tls

      - name: Reload final Nginx config
        ansible.builtin.service:
            name: nginx
            state: reloaded
        when: nginx_enable_tls

      - name: Pull docker images for stack
        ansible.builtin.command:
            cmd: "{{ compose_cmd }} pull"
            chdir: "{{ bitenex_compose_dir }}"

      - name: Deploy docker compose stack
        ansible.builtin.command:
            cmd: "{{ compose_cmd }} up -d --build --force-recreate"
            chdir: "{{ bitenex_compose_dir }}"

      - name: Wait for API port on loopback
        ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ bitenex_api_port }}"
            delay: 5
            timeout: 180

      - name: Run Alembic migrations
        ansible.builtin.command:
            cmd: "{{ compose_cmd }} exec -T api alembic upgrade head"
            chdir: "{{ bitenex_compose_dir }}"

      - name: Show docker compose service status
        ansible.builtin.command:
            cmd: "{{ compose_cmd }} ps"
            chdir: "{{ bitenex_compose_dir }}"
        changed_when: false
